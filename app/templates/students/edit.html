<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Student - ICT Attendance</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        .topbar {
            background: white;
            border-bottom: 1px solid #e5e7eb;
            padding: 18px 32px;
        }

        .topbar a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .container {
            max-width: 650px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 32px;
            border-radius: 16px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 8px 25px rgba(0,0,0,.05);
        }

        h1 {
            margin-top: 0;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 28px;
        }

        .info {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 22px;
        }

        .warning {
            margin-top: 8px;
            color: #64748b;
            font-size: 13px;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 13px;
            border-radius: 9px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 15px;
            margin-bottom: 20px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

    </style>

</head>

<body>

<div class="topbar">

    <a href="{{ url_for(
        'batches.batch_students',
        batch_id=student.batch_id
    ) }}">
        ← Back to {{ student.batch.name }}
    </a>

</div>


<main class="container">

    <div class="card">

        <h1>Edit Student</h1>

        <p class="subtitle">
            Correct the student's information.
        </p>


        {% if error %}

            <div class="error">
                {{ error }}
            </div>

        {% endif %}


        <div class="info">

            <strong>Current Batch:</strong>
            {{ student.batch.name }}

            <div class="warning">
                Batch cannot be changed from this form.
                Use a controlled transfer process if a student
                changes batch.
            </div>

        </div>


        <form method="POST">

            <label for="student_id">
                Student ID
            </label>

            <input
                type="text"
                id="student_id"
                name="student_id"
                value="{{ student.student_id }}"
                required
            >


            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                value="{{ student.name }}"
                required
            >


            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                value="{{ student.email }}"
            >


            <button type="submit">
                Save Changes
            </button>

        </form>

    </div>

</main>

</body>

</html>

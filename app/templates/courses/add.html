<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Course | ICT Attendance</title>


    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        .page {
            max-width: 700px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .back {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .card {
            background: white;
            margin-top: 25px;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,.07);
        }

        h1 {
            margin-top: 0;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #2563eb;
        }

        .batch-preview {
            margin-top: 8px;
            padding: 12px;
            background: #eff6ff;
            color: #1d4ed8;
            border-radius: 9px;
            font-size: 13px;
            display: none;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 13px;
            border-radius: 9px;
            margin-bottom: 20px;
        }

        .info {
            background: #f0fdf4;
            color: #166534;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 22px;
            line-height: 1.5;
            font-size: 13px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 9px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

    </style>

</head>


<body>

<div class="page">


    <a
        href="{{ url_for('courses.list_courses') }}"
        class="back"
    >
        ← Back to Courses
    </a>


    <div class="card">

        <h1>
            Add Course
        </h1>


        <p class="subtitle">
            Create a course offering for a specific batch.
        </p>


        {% if error %}

            <div class="error">
                {{ error }}
            </div>

        {% endif %}


        <div class="info">

            <strong>How this works:</strong><br>

            Select a batch and its academic session will
            automatically be assigned to the course.

            You do not need to enter the academic session
            manually.

        </div>


        <form method="POST">


            <!-- COURSE CODE -->

            <div class="form-group">

                <label for="course_code">
                    Course Code
                </label>

                <input
                    type="text"
                    id="course_code"
                    name="course_code"
                    placeholder="Example: ICT-2107"
                    required
                >

            </div>


            <!-- COURSE NAME -->

            <div class="form-group">

                <label for="course_name">
                    Course Name
                </label>

                <input
                    type="text"
                    id="course_name"
                    name="course_name"
                    placeholder="Example: Object Oriented Programming"
                    required
                >

            </div>


            <!-- BATCH -->

            <div class="form-group">

                <label for="batch_id">
                    Batch
                </label>

                <select
                    id="batch_id"
                    name="batch_id"
                    required
                >

                    <option value="">
                        -- Select Batch --
                    </option>


                    {% for batch in batches %}

                        <option
                            value="{{ batch.id }}"
                            data-session="{{ batch.academic_session or '' }}"
                        >

                            {{ batch.name }}

                            {% if batch.academic_session %}

                                — {{ batch.academic_session }}

                            {% endif %}

                        </option>

                    {% endfor %}

                </select>


                <div
                    id="sessionPreview"
                    class="batch-preview"
                >
                </div>

            </div>


            <button type="submit">
                Create Course
            </button>


        </form>

    </div>

</div>


<script>

    const batchSelect =
        document.getElementById("batch_id");

    const sessionPreview =
        document.getElementById("sessionPreview");


    batchSelect.addEventListener(
        "change",
        function () {

            const selected =
                this.options[this.selectedIndex];

            const session =
                selected.dataset.session;


            if (session) {

                sessionPreview.style.display =
                    "block";

                sessionPreview.textContent =
                    "Academic Session: " + session;

            } else {

                sessionPreview.style.display =
                    "none";

                sessionPreview.textContent =
                    "";

            }

        }
    );

</script>

</body>

</html>
